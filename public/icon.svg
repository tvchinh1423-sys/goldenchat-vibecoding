<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Chat Bubble Shape -->
  <path d="M120 160 C120 120, 160 90, 256 90 C352 90, 392 120, 392 160 C392 230, 340 270, 270 275 L230 330 C220 342, 202 334, 206 318 L214 275 C150 268, 120 220, 120 160 Z" 
        fill="url(#iconGrad)" 
        opacity="0.95"
        filter="url(#shadow)" />

  <!-- AI Stars Sparkles inside Chat Bubble -->
  <path d="M256 125 L263 150 L288 157 L263 164 L256 189 L249 164 L224 157 L249 150 Z" fill="#2563eb" />
  <path d="M315 175 L319 190 L334 194 L319 198 L315 213 L311 198 L296 194 L311 190 Z" fill="#3b82f6" />
  <circle cx="190" cy="180" r="10" fill="#2563eb" />
  <circle cx="230" cy="195" r="7" fill="#60a5fa" />

  <!-- Small Zalo/FB dots -->
  <circle cx="390" cy="380" r="44" fill="#0084ff" stroke="#ffffff" stroke-width="8" />
  <circle cx="330" cy="400" r="36" fill="#0068ff" stroke="#ffffff" stroke-width="6" />
</svg>
